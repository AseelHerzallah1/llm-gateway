name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: llm_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d llm_gateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/llm_gateway
          OPENAI_API_KEY: sk-test-dummy
          ANTHROPIC_API_KEY: sk-ant-test-dummy
          GROQ_API_KEY: gsk-test-dummy
          SECRET_KEY: release-test-secret-key
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/llm_gateway
          OPENAI_API_KEY: sk-test-dummy
          ANTHROPIC_API_KEY: sk-ant-test-dummy
          GROQ_API_KEY: gsk-test-dummy
          SECRET_KEY: release-test-secret-key
        run: pytest -q

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aseelherzallah1/llm-gateway:${{ steps.version.outputs.version }}
            ghcr.io/aseelherzallah1/llm-gateway:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
