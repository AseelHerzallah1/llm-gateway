services:
  db:
    image: postgres:16-alpine
    container_name: llm-gateway-db
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: llm_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: llm-gateway-app
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Inside Docker network, PostgreSQL hostname is the service name "db"
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/llm_gateway
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
